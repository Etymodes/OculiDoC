name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Verify tag and project version
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$version"
          }
          if (([version]$version).Major -ge 1) {
            throw "TRUSTED_SIGNING_PROVIDER_REQUIRED_FOR_V1: hospital-grade signing is not configured."
          }
          Write-Host "RELEASE_CHANNEL=pre-1.0-lightweight"
      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,research,build]"
      - name: Validate source
        shell: pwsh
        run: ./scripts/check.ps1 -PythonCommand python
      - name: Prepare clean release environment
        shell: pwsh
        run: |
          python -m venv .release-venv
          ./.release-venv/Scripts/python.exe -m pip install --upgrade pip
          ./.release-venv/Scripts/python.exe -m pip install -e ".[research,build]"
      - name: Build and verify release
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $releasePython = (
            Resolve-Path "./.release-venv/Scripts/python.exe"
          ).Path
          ./scripts/build_windows.ps1 -PythonCommand $releasePython
          ./scripts/package_windows_release.ps1 -PythonCommand $releasePython
          ./scripts/inventory_windows_signing.ps1 `
            -BundleRoot ./dist/windows/OculiDoC `
            -OutputPath ./dist/release/OculiDoC_bundle_signing_inventory.json
      - name: Attest pre-1.0 release assets
        uses: actions/attest@v4
        with:
          subject-path: dist/release/*
      - name: Verify pre-1.0 build provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $portable = Get-ChildItem "dist/release" `
            -Filter "OculiDoC-v*-windows-x64-portable.zip" `
            -File
          if ($portable.Count -ne 1) {
            throw "Expected exactly one portable release package."
          }
          gh attestation verify "dist/release/OculiDoC-Setup.exe" `
            -R $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to verify setup build provenance."
          }
          gh attestation verify $portable.FullName `
            -R $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to verify portable build provenance."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OculiDoC-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem "dist/release" -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; publish a new patch version instead."
          }
          gh release create $tag $assets `
            --title "OculiDoC $tag" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create release."
          }
          $published = gh release view $tag `
            --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if (
            $LASTEXITCODE -ne 0 -or
            $published.tagName -ne $tag -or
            $published.isDraft -or
            $published.isPrerelease -or
            $published.assets.Count -ne $assets.Count
          ) {
            throw "Published release verification failed."
          }
