name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libpulse0 libxkbcommon-x11-0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,research]"
      - name: Validate
        env:
          OCULIDOC_ENVIRONMENT: test
          OCULIDOC_GAZE_SOURCE: mock
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip check
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest
          python -m compileall -q src tests

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Windows PowerShell 5.1 scripts
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1."
          }
          Get-ChildItem ./scripts -Filter *.ps1 -File | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw "$($_.Name) must be UTF-8 with BOM."
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "$($_.FullName): $($parseErrors | Out-String)"
            }
          }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,research,build]"
      - name: Validate source
        shell: pwsh
        env:
          OCULIDOC_ENVIRONMENT: test
          OCULIDOC_GAZE_SOURCE: mock
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/check.ps1 -PythonCommand python
      - name: Build and verify portable package
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1 -PythonCommand python
          ./scripts/package_windows_release.ps1 -PythonCommand python
          ./scripts/inventory_windows_signing.ps1 `
            -BundleRoot ./dist/windows/OculiDoC `
            -OutputPath ./dist/release/OculiDoC_bundle_signing_inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: OculiDoC-windows-release-candidate
          path: dist/release/*
          if-no-files-found: error
