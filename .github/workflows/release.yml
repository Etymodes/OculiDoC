name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tag and project version
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$version"
          }
      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,research,build]"
      - name: Validate source
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build and verify release
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          ./scripts/build_windows.ps1 -PythonCommand python
          ./scripts/package_windows_release.ps1 -PythonCommand python
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem "dist/release" -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --title "OculiDoC $tag" --generate-notes
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OculiDoC-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
