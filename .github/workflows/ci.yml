name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,research]"
      - name: Validate
        env:
          OCULIDOC_ENVIRONMENT: test
          OCULIDOC_GAZE_SOURCE: mock
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip check
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest
          python -m compileall -q src tests

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,research,build]"
      - name: Validate source
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build and verify portable package
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1 -PythonCommand python
          ./scripts/package_windows_release.ps1 -PythonCommand python
      - uses: actions/upload-artifact@v4
        with:
          name: OculiDoC-windows-release-candidate
          path: dist/release/*
          if-no-files-found: error
